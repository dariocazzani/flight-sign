<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Flight Sign">
<title>Flight Sign</title>
<style>
  :root { color-scheme: dark; --bg: #0b0b0b; --fg: #ececec; --dim: #8e8e8e; --edge: #2c2c2c; --chip: #161616; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; padding: 24px 16px 32px; color: var(--fg); background: var(--bg);
         font: 15px/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  main { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
  #sign { display: grid; place-items: center; }
  #sign:fullscreen { background: #000; }
  #cv { display: block; box-sizing: content-box; padding: clamp(6px, 1.4vw, 18px); background: #000; border-radius: 8px;
        box-shadow: inset 0 1px 0 #2a2a2a, 0 30px 60px -30px #000; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
  #sign:fullscreen #cv { padding: 0; border-radius: 0; box-shadow: none; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button, #at { font: inherit; color: inherit; background: var(--chip); border: 1px solid var(--edge); border-radius: 999px; padding: 8px 16px; }
  button { cursor: pointer; }
  button:hover, #at:focus { border-color: #5a5a5a; outline: none; }
  #at { flex: 1 1 240px; min-width: 0; }
  #radius { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--edge); border-radius: 999px; overflow: hidden; }
  #radius label { position: relative; padding: 8px 12px; color: var(--dim); cursor: pointer; }
  #radius input { position: absolute; opacity: 0; }
  #radius label:has(:checked) { background: var(--fg); color: #000; }
  #radius label:has(:focus-visible) { outline: 2px solid var(--fg); outline-offset: -4px; }
  .note { margin: 0; color: var(--dim); font-size: 13px; }
  .note a { color: inherit; }
</style>
</head>
<body>
<main>
  <div id="sign"><canvas id="cv" title="Tap for the next plane"></canvas></div>
  <form id="where" class="row">
    <input id="at" placeholder="Latitude, longitude, e.g. 40.758, -73.986" autocomplete="off" aria-label="Location" required
           pattern="\s*-?\d+(\.\d+)?\s*[,\s]\s*-?\d+(\.\d+)?\s*" title="Latitude, longitude">
    <button>Set</button>
    <button id="geo" type="button">Use my location</button>
  </form>
  <div class="row">
    <div id="radius" role="radiogroup" aria-label="Radius"></div>
    <button id="fs" type="button">Fullscreen</button>
  </div>
  <p class="note">Shows the five nearest planes in the air. Tap the sign for the next one. Keys: N next, F fullscreen. Your setup is saved in the URL, so bookmark it.</p>
  <p class="note">Positions from <a href="https://adsb.lol">adsb.lol</a> (ODbL), routes from <a href="https://www.adsbdb.com">adsbdb</a>. Route data comes from callsign databases and can be wrong. Not affiliated with TheFlightWall.</p>
</main>

<script id="core">
// Pure helpers, no DOM. check.mjs runs this block in Node.
// ponytail: fonts, text() and the LED look are copied from mta-arrival-sign; pull out a shared led.js if a third sign shows up.

// Public-domain X11 misc-fixed bitmap fonts (the same ones rpi-rgb-led-matrix ships), ASCII 32..126,
// one byte per glyph row, most significant bit = leftmost pixel.
const FONT5 = font(5, 8, '0000000000000000002020202000200000505050000000005050f850f85050002070a07028702000004050205010000040a0a040a0a0500000202020000000000020404040402000004020202020400000009060f060900000002020f8202000000000000030204000000000f00000000000000000207020001010204080800000205050505020000020602020207000006090106080f00000f0206010906000002060a0f020200000f080e010906000006080e09090600000f010202040400000609060909060000060909070106000000060600060600000003030003020400010204040201000000000f000f0000000402010102040000020501020002000304898a8a890403000609090f090900000e090e09090e000006090808090600000e090909090e00000f080e08080f00000f080e08080800000609080b0906000009090f09090900000702020202070000070202020a040000090a0c0a0a09000008080808080f0000090f0f0909090000090d0f0b0b09000006090909090600000e09090e080800000609090d0b0601000e09090e0909000006090402090600000702020202020000090909090906000009090909060600000909090f0f090000090906060909000008888502020200000f010204080f000007040404040700000808040201010000070101010107000002050000000000000000000000000f000402000000000000000007090907000008080e09090e0000000003040403000001010709090700000000060b0c0600000205040e04040000000006090701060008080e0909090000020006020207000001000101010502000808090e09090000060202020207000000000d0a8a8a800000000e0909090000000006090906000000000e090e080800000007090701010000000a0d08080000000003060106000004040e0405020000000009090907000000000505050200000000088a8a8500000000090606090000000009090709060000000f02040f000304020c0204030000020202020202000c02040304020c0000050a00000000000');
const FONT6 = font(6, 13, '0000000000000000000000000000002020202020202000200000000050505000000000000000000000005050f850f8505000000000002078a0a0702828f0200000000048a85010204050a890000000000040a0a040a09890680000000020202000000000000000000010202040404040402020100000402020101010101020204000000020a870a820000000000000000000002020f820200000000000000000000000000030204000000000000000f800000000000000000000000000000020702000000008081010204040808000000000205088888888885020000000002060a02020202020f8000000007088880810204080f800000000f8081020700808887000000000101030505090f8101000000000f88080b0c8080888700000000070888080f08888887000000000f80810102020404040000000007088888870888888700000000070888888780808887000000000000020702000002070200000000000207020000030204000000008102040804020100800000000000000f80000f8000000000000804020100810204080000000007088880810202000200000000070888898a8a8b08078000000002050888888f888888800000000f048484870484848f00000000070888080808080887000000000f048484848484848f000000000f8808080f0808080f800000000f8808080f080808080000000007088808080988888700000000088888888f888888888000000007020202020202020700000000038101010101010906000000000888890a0c0a0908888000000008080808080808080f8000000008888d8a8a8888888880000000088c8c8a8a8989888880000000070888888888888887000000000f0888888f0808080800000000070888888888888a87008000000f0888888f0a09088880000000070888080700808887000000000f8202020202020202000000000888888888888888870000000008888888850505020200000000088888888a8a8a8a850000000008888505020505088880000000088885050202020202000000000f808101020404080f80000007040404040404040404070000000808040402010100808000000701010101010101010107000000020508800000000000000000000000000000000000000f80000201000000000000000000000000000000070087888986800000000808080f088888888f00000000000000070888080887000000000080808788888888878000000000000007088f88088700000000030484040f0404040400000000000000070888888780888700000808080b0c88888888800000000002000602020202070000000000010003010101010909060000080808090a0c0a090880000000060202020202020207000000000000000d0a8a8a8a88800000000000000b0c8888888880000000000000070888888887000000000000000f0888888f0808080000000000078888888780808080000000000b0c8808080800000000000000070886010887000000000004040f040404048300000000000000088888888986800000000000000888888505020000000000000008888a8a8a850000000000000008850202050880000000000000088888898680888700000000000f810204080f80000001820202020c02020202018000000202020202020202020000000c0202020201820202020c000000048a8900000000000000000');
function font(w, h, hex) { return { w, h, g: Uint8Array.from(hex.match(/../g), b => parseInt(b, 16)) }; }

// adsb.lol area query -> the n nearest planes in the air, nearest first (dst is nautical miles from the query point).
const nearby = (j, n = 5) => (j.ac ?? []).filter(a => a.alt_baro !== 'ground').sort((a, b) => a.dst - b.dst).slice(0, n);

// Callsign route databases go stale when a flight number moves to another route, so a route only counts if the plane
// is roughly on the way: origin -> plane -> destination can't be much longer than origin -> destination.
// ponytail: catches routes that are way off; adsb.lol's routeset API has a stricter plausibility check if subtle ones slip through.
const RAD = Math.PI / 180;
const nm = (la1, lo1, la2, lo2) => 6880 * Math.asin(Math.sqrt(Math.sin((la2 - la1) * RAD / 2) ** 2 + Math.cos(la1 * RAD) * Math.cos(la2 * RAD) * Math.sin((lo2 - lo1) * RAD / 2) ** 2));
const plausible = ({ origin: o, destination: d }, lat, lon) =>
  nm(o.latitude, o.longitude, lat, lon) + nm(lat, lon, d.latitude, d.longitude) < 1.25 * nm(o.latitude, o.longitude, d.latitude, d.longitude) + 100;
</script>

<script>
const $ = s => document.querySelector(s);
const rgb = h => (0xff000000 | parseInt(h.slice(5, 7), 16) << 16 | parseInt(h.slice(3, 5), 16) << 8 | parseInt(h.slice(1, 3), 16)) >>> 0;
const RED = rgb('#ff3a22'), AMBER = rgb('#ffb238'), WHITE = rgb('#fff1d6'), GREEN = rgb('#35e06b'), SKY = rgb('#52c7ff'), DIM = rgb('#4a4036');
const MI = 1.15078;   // statute miles per nautical mile; adsb.lol speaks nm and knots
const RADII = [5, 10, 25], DWELL = 6000;   // radius choices in miles; ms per plane
const COMPASS = 'N NE E SE S SW W NW'.split(' ');
// ICAO type designator -> the name people know. ponytail: common airliners and NYC helicopters only; anything else shows its code.
const TYPES = Object.fromEntries(('A19N Airbus A319neo,A20N Airbus A320neo,A21N Airbus A321neo,A306 Airbus A300-600,A318 Airbus A318,'
  + 'A319 Airbus A319,A320 Airbus A320,A321 Airbus A321,A332 Airbus A330-200,A333 Airbus A330-300,A339 Airbus A330-900,'
  + 'A346 Airbus A340-600,A359 Airbus A350-900,A35K Airbus A350-1000,A388 Airbus A380,BCS1 Airbus A220-100,BCS3 Airbus A220-300,'
  + 'B712 Boeing 717,B737 Boeing 737-700,B738 Boeing 737-800,B739 Boeing 737-900,B38M Boeing 737 MAX 8,B39M Boeing 737 MAX 9,'
  + 'B744 Boeing 747-400,B748 Boeing 747-8,B752 Boeing 757-200,B753 Boeing 757-300,B762 Boeing 767-200,B763 Boeing 767-300,'
  + 'B764 Boeing 767-400,B772 Boeing 777-200,B77L Boeing 777-200LR/F,B77W Boeing 777-300ER,B788 Boeing 787-8,B789 Boeing 787-9,'
  + 'B78X Boeing 787-10,CRJ2 Bombardier CRJ200,CRJ7 Bombardier CRJ700,CRJ9 Bombardier CRJ900,DH8D Dash 8-400,E145 Embraer ERJ-145,'
  + 'E170 Embraer 170,E75L Embraer 175,E75S Embraer 175,E190 Embraer 190,E195 Embraer 195,E290 Embraer E190-E2,E295 Embraer E195-E2,'
  + 'MD11 McDonnell Douglas MD-11,A109 Leonardo AW109,A139 Leonardo AW139,AS50 Airbus AS350,B06 Bell 206,B407 Bell 407,B429 Bell 429,'
  + 'EC30 Airbus H130,EC35 Airbus H135,EC45 Airbus H145,R44 Robinson R44,R66 Robinson R66,S76 Sikorsky S-76')
  .split(',').map(s => { const i = s.indexOf(' '); return [s.slice(0, i), s.slice(i + 1)]; }));
const fit = (s, n) => { if (s.length <= n) return s; const i = s.lastIndexOf(' ', n); return i > 0 ? s.slice(0, i) : s.slice(0, n); };   // cut at a word boundary
const cut = (a, b, n) => a.slice(0, Math.max(n - b.length, n >> 1)).trim();   // a's share of n chars when printed next to b
const ascii = s => s.normalize('NFKD').replace(/[^ -~]/g, '');   // Montréal -> Montreal
const parseAt = s => { const [la, lo] = (s ?? '').split(/[\s,]+/).filter(Boolean).map(Number); return Math.abs(la) <= 90 && Math.abs(lo) <= 180 ? [la, lo] : null; };

// ---- state: setup lives in the URL (?at=40.758,-73.986&r=10), mirrored to localStorage for bare visits ----
let saved = null; try { saved = localStorage.getItem('flights'); } catch {}
// A home-screen app relaunches the URL it was added with, so there the last saved setup wins.
const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
const init = new URLSearchParams(saved && (standalone || location.search.length < 2) ? saved : location.search || '?at=40.758,-73.986&r=10');
let at = parseAt(init.get('at')) ?? [40.758, -73.986], radius = RADII.includes(+init.get('r')) ? +init.get('r') : 10;
let flights = [], lastOk = 0, showHex, shownAt = 0, dirty = true;
const started = Date.now(), routes = new Map();   // callsign -> adsbdb flightroute; null while loading or when unknown

// ---- data ----
async function poll() {
  const res = await fetch(`/api/point?lat=${at[0]}&lon=${at[1]}&r=${(radius / MI).toFixed(1)}`);
  if (!res.ok) throw Error(res.status);
  flights = nearby(await res.json()); lastOk = Date.now();
  flights.forEach(a => lookup(a.flight?.trim()));   // prefetch, so a plane's route is usually in before its turn
}
const tick = () => poll().catch(() => {});   // a failed poll keeps the last list until it goes stale
function lookup(cs) {
  if (!cs || routes.has(cs)) return;
  if (routes.size > 2000) routes.clear();   // a wall sign runs for weeks, and schedules change anyway
  routes.set(cs, null);
  fetch('https://api.adsbdb.com/v0/callsign/' + encodeURIComponent(cs))
    .then(r => r.status === 404 ? null : r.ok ? r.json().then(j => j.response.flightroute) : Promise.reject())
    .then(fr => routes.set(cs, fr), () => routes.delete(cs));   // network trouble: ask again next poll
}

// ---- controls ----
const fullscreen = () => { const s = $('#sign'); if (document.fullscreenElement) document.exitFullscreen(); else (s.requestFullscreen ?? s.webkitRequestFullscreen)?.call(s); };
function next() {   // when the current plane has flown off, start over at the nearest
  const i = flights.findIndex(a => a.hex === showHex);
  showHex = flights[(i + 1) % flights.length]?.hex; shownAt = Date.now();
}
function save() {
  const q = `?at=${at.join(',')}&r=${radius}`;
  try { history.replaceState(null, '', q); localStorage.setItem('flights', q); } catch {}
  $('#at').value = at.join(', ');
  for (const b of document.getElementsByName('r')) b.checked = +b.value === radius;
}
$('#radius').innerHTML = RADII.map(m => `<label><input type="radio" name="r" value="${m}">${m} mi</label>`).join('');
$('#radius').onchange = e => { radius = +e.target.value; save(); tick(); };
$('#where').onsubmit = e => { e.preventDefault(); const p = parseAt($('#at').value); if (p) { at = p; save(); tick(); } };
$('#geo').onclick = () => navigator.geolocation.getCurrentPosition(p => { at = [p.coords.latitude, p.coords.longitude].map(v => +v.toFixed(3)); save(); tick(); }, e => alert(e.message));
$('#cv').onclick = next;
$('#fs').onclick = fullscreen;
$('#fs').hidden = !(document.fullscreenEnabled || document.webkitFullscreenEnabled);   // iPhone: use Add to Home Screen instead
addEventListener('keydown', e => {
  if (e.target === $('#at') || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'n') next();
  if (k === 'f') fullscreen();
});

// ---- 128x64 framebuffer, the FlightWall Mini's resolution ----
const W = 128, H = 64;
const fb = Object.assign(document.createElement('canvas'), { width: W, height: H }), fctx = fb.getContext('2d');
const img = fctx.createImageData(W, H), buf = new Uint32Array(img.data.buffer), shown = new Uint32Array(buf.length);
function text(s, x, y, f, color, z = 1) {   // bitmap text at scale z; returns the x after it
  for (const ch of s) {
    const k = ch.charCodeAt(0) - 32, g = (k >= 0 && k < 95 ? k : 31) * f.h;   // anything outside ASCII draws '?'
    if (x < W && x + f.w * z > 0)
      for (let r = 0; r < f.h * z; r++) for (let i = 0; i < f.w * z; i++) {
        const X = x + i, Y = y + r;
        if (X >= 0 && X < W && Y >= 0 && Y < H && f.g[g + (r / z | 0)] & (128 >> (i / z | 0))) buf[Y * W + X] = color;
      }
    x += f.w * z;
  }
  return x;
}
const right = (s, y, f, color) => text(s, W - s.length * f.w, y, f, color);
function compose(now) {
  buf.fill(0);
  if (now - shownAt > DWELL || !flights.some(a => a.hex === showHex)) next();
  const stale = now - lastOk > 60000, a = !stale && flights.find(f => f.hex === showHex);
  if (!a) {
    text(!lastOk && now - started < 20000 ? 'Loading...' : stale ? 'No data' : 'Clear skies', 0, 16, FONT6, AMBER);
    if (!stale) text(`No planes within ${radius} mi`, 0, 34, FONT5, RED);
    return;
  }
  const cs = a.flight?.trim(), fr = cs && routes.get(cs), route = fr && plausible(fr, a.lat, a.lon) ? fr : null;
  const id = fr?.callsign_iata ?? cs ?? a.r ?? a.hex.toUpperCase(), top = route ? id : a.r && a.r !== id ? a.r : '';
  text(top, 0, 0, FONT5, WHITE);
  if (fr?.airline) right(fit(fr.airline.name, 24 - top.length), 0, FONT5, SKY);
  if (route) {   // big airport codes, cities underneath
    const [o, d] = [route.origin, route.destination], [oc, dc] = [o, d].map(p => p.iata_code || p.icao_code), [on, dn] = [o, d].map(p => ascii(p.municipality ?? p.name));
    let x = (W - (oc.length + dc.length) * 12 - 20) >> 1;
    x = text(oc, x, 6, FONT6, AMBER, 2); x = text('>', x + 4, 6, FONT6, RED, 2); text(dc, x + 4, 6, FONT6, AMBER, 2);
    x = text(cut(on, dn, 22), 0, 31, FONT5, AMBER); x = text(' > ', x, 31, FONT5, RED); text(cut(dn, on, 22), x, 31, FONT5, AMBER);
  } else text(id, (W - id.length * 12) >> 1, 6, FONT6, AMBER, 2);
  text(TYPES[a.t] ?? a.t ?? '', 0, 42, FONT5, WHITE);
  text([typeof a.alt_baro === 'number' && a.alt_baro + 'ft', a.gs != null && Math.round(a.gs * MI) + 'mph'].filter(Boolean).join(' '), 0, 53, FONT5, GREEN);
  right(`${(a.dst * MI).toFixed(1)}mi ${COMPASS[Math.round(a.dir / 45) % 8] ?? ''}`.trim(), 53, FONT5, WHITE);   // where to look
  const n = flights.length, cur = flights.indexOf(a);
  if (n > 1) for (let k = 0; k < n; k++) buf.fill(k === cur ? WHITE : DIM, 63 * W + 65 - n * 3 + k * 6, 63 * W + 69 - n * 3 + k * 6);   // pager
}

// ---- LED look: scale the framebuffer up, punch it into round dots, add a little bloom ----
const cv = $('#cv'), ctx = cv.getContext('2d');
let dots = null;
new ResizeObserver(() => {
  const r = $('#sign').getBoundingClientRect(), dpr = devicePixelRatio || 1, pad = 2 * parseFloat(getComputedStyle(cv).paddingLeft);
  const room = Math.min((r.width - pad) / W, ((document.fullscreenElement ? r.height : innerHeight * 0.7) - pad) / H);   // 2:1 is tall, leave room for the controls
  const cell = Math.max(2, Math.floor(room * dpr));   // whole device pixels per LED keeps the dots crisp
  if (cv.width === cell * W) return;   // our own height change re-fires this; resizing again would blank the canvas
  cv.width = cell * W; cv.height = cell * H; cv.style.width = cv.width / dpr + 'px';
  const tile = Object.assign(document.createElement('canvas'), { width: cell, height: cell }), g = tile.getContext('2d');
  g.fillRect(0, 0, cell, cell);   // black tile with a round hole the LED shows through
  g.globalCompositeOperation = 'destination-out'; g.arc(cell / 2, cell / 2, cell * 0.4, 0, 2 * Math.PI); g.fill();
  dots = ctx.createPattern(tile, 'repeat'); dirty = true;
}).observe($('#sign'));
(function frame() {
  requestAnimationFrame(frame);
  compose(Date.now());
  if (!dirty && buf.every((v, i) => v === shown[i])) return;
  dirty = false; shown.set(buf); fctx.putImageData(img, 0, 0);
  const w = cv.width, h = cv.height;
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#151515'; ctx.fillRect(0, 0, w, h);                          // unlit LEDs
  ctx.imageSmoothingEnabled = false; ctx.drawImage(fb, 0, 0, w, h);             // lit LEDs as squares
  if (dots) { ctx.fillStyle = dots; ctx.fillRect(0, 0, w, h); }                 // cut into round dots
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.35;
  ctx.imageSmoothingEnabled = true; ctx.drawImage(fb, 0, 0, w, h);              // soft bloom
})();

save();   // normalizes the URL and fills in the controls
tick(); setInterval(tick, 10000);
const wake = () => navigator.wakeLock?.request('screen').catch(() => {});   // keep a wall tablet's screen on
wake();
document.addEventListener('visibilitychange', () => { if (!document.hidden) { wake(); tick(); } });
</script>
</body>
</html>
